<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 | Wangila W. Job</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a192f;
      color: #ccd6f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    .code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 5rem;
      font-weight: 700;
      color: #64ffda;
      line-height: 1;
    }
    h1 { font-size: 1.4rem; color: #e6f1ff; margin: 16px 0 8px; font-weight: 600; }
    p { font-size: 0.95rem; color: #8892b0; margin-bottom: 28px; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 12px 26px;
      border: 1px solid #64ffda;
      border-radius: 8px;
      color: #64ffda;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    a:hover { background: rgba(100, 255, 218, 0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
